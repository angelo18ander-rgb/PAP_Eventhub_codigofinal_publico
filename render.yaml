services:
  - type: web
    name: eventhub-api-angelo18ander-rgb
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: EVENTHUB_ENV
        value: production
      - key: EVENTHUB_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://angelo18ander-rgb.github.io
