<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <base href="../../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de bilhetes — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="frontend/styles/core/variables.css">
  <link rel="stylesheet" href="frontend/styles/core/base.css">
  <link rel="stylesheet" href="frontend/styles/core/components.css?v=13">
  <link rel="stylesheet" href="frontend/styles/core/layout.css?v=2">
  <link rel="stylesheet" href="frontend/staff/staff.css?v=1">
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar para o conteúdo principal</a>
  <div id="navbar-placeholder"></div>
  <main id="main-content" class="page-main">
    <section class="section checkin-section">
      <div class="container checkin-container">
        <a href="frontend/staff/staff.html" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Eventos da equipa</a>
        <div class="checkin-heading">
          <h1 id="checkin-event-title">Validação de bilhetes</h1>
          <p id="checkin-event-details">A carregar o acesso ao evento…</p>
        </div>
        <div class="card scanner-card">
          <div id="ticket-qr-reader" class="ticket-qr-reader"></div>
          <p id="scanner-message" class="scanner-message" role="status">É necessário aceder à câmara para ler os bilhetes.</p>
          <button type="button" class="btn btn-primary btn-lg btn-block" id="start-scanner-btn" disabled><i class="fa-solid fa-camera"></i> Iniciar leitura pela câmara</button>
          <p class="scanner-privacy-note">A câmara é utilizada apenas para ler códigos QR de bilhetes. O acesso requer normalmente HTTPS ou localhost.</p>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <div class="checkin-feedback" id="checkin-feedback" hidden role="alert" aria-live="assertive">
    <div class="checkin-feedback-card">
      <i class="checkin-feedback-icon fa-solid" id="checkin-feedback-icon"></i>
      <h1 id="checkin-feedback-title"></h1>
      <p id="checkin-feedback-message"></p>
      <button type="button" class="btn btn-lg" id="scan-next-btn">Ler o próximo bilhete</button>
      <a href="frontend/staff/staff.html" class="feedback-back-link">Voltar aos eventos da equipa</a>
    </div>
  </div>
  <script src="frontend/scripts/core/api.js?v=18"></script>
  <script src="frontend/scripts/core/db.js?v=13"></script>
  <script src="frontend/scripts/core/ui.js?v=16"></script>
  <script src="frontend/scripts/core/auth.js?v=15"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="frontend/staff/staff-checkin.js?v=2"></script>
</body>
</html>
