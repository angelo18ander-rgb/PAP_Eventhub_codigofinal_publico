<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <base href="../../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Pessoas — EventHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <link rel="stylesheet" href="frontend/styles/core/variables.css">
  <link rel="stylesheet" href="frontend/styles/core/base.css">
  <link rel="stylesheet" href="frontend/styles/core/components.css?v=13">
  <link rel="stylesheet" href="frontend/styles/core/layout.css?v=2">
  <link rel="stylesheet" href="frontend/people/people.css?v=4">
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar para o conteúdo principal</a>
  <div id="navbar-placeholder"></div>
  <main id="main-content" class="page-main people-page">
    <section class="container">
      <header class="people-heading">
        <span class="eyebrow">Comunidade EventHub</span>
        <h1>Encontre pessoas com os mesmos interesses</h1>
        <p>Descubra organizadores e participantes que partilham os seus interesses.</p>
      </header>
      <section class="card people-search-panel" aria-label="Pesquisar pessoas">
        <label class="people-search-box" for="people-search-input">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="people-search-input" type="search" autocomplete="off" maxlength="100" placeholder="Pesquise nomes, biografias ou interesses em eventos" aria-describedby="people-search-help">
          <button type="button" id="people-search-clear" class="people-search-clear" aria-label="Limpar pesquisa" hidden><i class="fa-solid fa-xmark"></i></button>
        </label>
        <p id="people-search-help" class="form-hint">Introduza pelo menos 2 caracteres. Pesquise nomes, biografias e interesses públicos.</p>
        <div class="people-filter-tabs" role="tablist" aria-label="Filtrar pessoas por função">
          <button type="button" class="people-filter active" role="tab" aria-selected="true" data-role="all">Todas</button>
          <button type="button" class="people-filter" role="tab" aria-selected="false" data-role="creator">Organizadores</button>
          <button type="button" class="people-filter" role="tab" aria-selected="false" data-role="attendee">Participantes</button>
        </div>
      </section>
      <div id="people-search-status" class="people-search-status" role="status" aria-live="polite">Comece a escrever para descobrir pessoas.</div>
      <div id="people-results" class="people-results" aria-live="polite"></div>
      <div class="people-pagination">
        <button type="button" id="people-previous" class="btn btn-secondary" disabled><i class="fa-solid fa-arrow-left"></i> Anterior</button>
        <span id="people-page-label"></span>
        <button type="button" id="people-next" class="btn btn-secondary" disabled>Seguinte <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="frontend/scripts/core/api.js?v=18"></script>
  <script src="frontend/scripts/core/db.js?v=14"></script>
  <script src="frontend/scripts/core/ui.js?v=16"></script>
  <script src="frontend/scripts/core/auth.js?v=15"></script>
  <script src="frontend/people/people.js?v=3"></script>
</body>
</html>
