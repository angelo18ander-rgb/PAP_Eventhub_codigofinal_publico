<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <base href="../../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar eventos — EventHub</title>
  <meta name="description" content="Pesquise e filtre eventos por categoria, data e localização.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

  <link rel="stylesheet" href="frontend/styles/core/variables.css">
  <link rel="stylesheet" href="frontend/styles/core/base.css">
  <link rel="stylesheet" href="frontend/styles/core/components.css?v=13">
  <link rel="stylesheet" href="frontend/styles/core/layout.css?v=2">
  <link rel="stylesheet" href="frontend/events/events.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar para o conteúdo principal</a>

  <div id="navbar-placeholder"></div>

  <main id="main-content" class="page-main">
    <section class="page-header">
      <div class="container">
        <h1>Explorar eventos</h1>
        <p>Encontre o evento ideal com a pesquisa, os filtros e a ordenação.</p>
      </div>
    </section>

    <section class="section" style="padding-top:20px;">
      <div class="container">

        <div class="filters-bar card">
          <div class="filters-row">
            <div class="input-icon-wrap search-input-wrap">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="search" id="search-input" class="form-input" placeholder="Pesquise eventos por nome, descrição ou local...">
            </div>
            <button class="btn btn-secondary" id="filters-toggle-btn"><i class="fa-solid fa-sliders"></i> Filtros</button>
          </div>
          <div class="filters-grid" id="filters-grid">
            <div class="form-group">
              <label class="form-label" for="filter-category">Categoria</label>
              <select id="filter-category" class="form-input">
                <option value="">Todas as categorias</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="filter-date">Data</label>
              <select id="filter-date" class="form-input">
                <option value="">Qualquer data</option>
                <option value="today">Hoje</option>
                <option value="week">Esta semana</option>
                <option value="month">Este mês</option>
                <option value="past">Eventos anteriores</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="filter-location">Localização</label>
              <select id="filter-location" class="form-input">
                <option value="">Todas as localizações</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="filter-sort">Ordenar por</label>
              <select id="filter-sort" class="form-input">
                <option value="date-asc">Data: mais próximos primeiro</option>
                <option value="date-desc">Data: mais distantes primeiro</option>
                <option value="popularity">Mais populares</option>
                <option value="title">Título (A-Z)</option>
                <option value="spots">Lugares disponíveis</option>
              </select>
            </div>
          </div>
          <div class="active-filters" id="active-filters"></div>
        </div>

        <div class="results-bar">
          <span id="results-count">0 eventos encontrados</span>
          <button class="btn btn-ghost btn-sm" id="clear-filters-btn"><i class="fa-solid fa-rotate-left"></i> Limpar tudo</button>
        </div>

        <div class="events-grid" id="events-grid"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts corrigidos: api.js carregado em primeiro lugar -->
  <script src="frontend/scripts/core/api.js?v=18"></script>
  <script src="frontend/scripts/core/db.js?v=13"></script>
  <script src="frontend/scripts/core/ui.js?v=16"></script>
  <script src="frontend/scripts/core/auth.js?v=15"></script>
  <script src="frontend/events/event-card.js?v=7"></script>
  <script src="frontend/events/events.js?v=7"></script>
</body>
</html>
