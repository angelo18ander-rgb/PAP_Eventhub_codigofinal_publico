app = "pap-eventhub-codigofinal-publico"

[build]
  dockerfile = "Dockerfile"

[env]
  EVENTHUB_ENV = "production"
  EVENTHUB_DATABASE_PATH = "/data/eventhub.db"
  CORS_ALLOWED_ORIGINS = "https://angelo18ander-rgb.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/openapi.json"

[[mounts]]
  source = "eventhub_data"
  destination = "/data"
